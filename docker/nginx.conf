server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        application/xml
        image/svg+xml
        font/woff2;

    # Cabeceras de seguridad básicas. Nada de Cross-Origin-Opener-Policy ni
    # Cross-Origin-Embedder-Policy: cualquiera de las dos rompe el popup de
    # inicio de sesión con Google (ventana cruzada de origen). Tampoco hay
    # Content-Security-Policy: Firebase, reCAPTCHA Enterprise y el popup de
    # Google cargan scripts e iframes de varios orígenes de Google, y una
    # CSP sin probar a fondo contra todos ellos rompería la app en vez de
    # protegerla (ver docs/security.md si se quiere intentar más adelante).
    #
    # IMPORTANTE: `add_header` en nginx no se hereda en un bloque
    # `location` que defina su propio `add_header` (aquí, el de
    # Cache-Control) — se descartarían las de aquí arriba silenciosamente.
    # Por eso las tres se repiten dentro de cada `location`, no solo aquí.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Flutter web no versiona sus archivos por el nombre: "main.dart.js",
    # "flutter.js", "flutter_bootstrap.js" y "flutter_service_worker.js" se
    # llaman siempre igual entre una build y la siguiente (a diferencia de
    # un build típico de webpack con hash en el nombre del archivo). Quien
    # detecta que hay una versión nueva es el propio
    # "flutter_service_worker.js", comparando los hashes que ya lleva
    # dentro contra "version.json". Por eso nada en la raíz lleva caché
    # larga aquí: "no-cache" no significa "no guardar nada", significa que
    # el navegador revalida con ETag/Last-Modified en cada visita antes de
    # reutilizar la copia local — rápido si no ha cambiado (304, sin
    # volver a descargar el cuerpo), correcto si ha cambiado (200, cuerpo
    # nuevo). Cubre tanto los archivos reales de la raíz (index.html,
    # main.dart.js, flutter.js, flutter_bootstrap.js,
    # flutter_service_worker.js, version.json, manifest.json) como el
    # resto de rutas de la SPA, que caen aquí mismo por el "try_files".
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # CanvasKit (el motor de render en wasm) y las fuentes pesan bastante
    # y cambian poco, pero sí pueden cambiar en una build nueva con la
    # misma ruta: caché corta (como mucho un día), nunca "immutable".
    location ^~ /canvaskit/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location ~* \.(woff2?|ttf|otf)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
}
